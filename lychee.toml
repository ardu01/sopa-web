#
# Enlaces externos. Los reintentos cubren cortes y límites puntuales.
# No se aceptan todos los 403: un 403 también puede ser un enlace roto.

max_retries = 5
retry_wait_time = 8
timeout = 40
max_concurrency = 2

exclude_path = ["descargas", "node_modules", "package-lock\\.json"]

exclude = [
  # Reto de Cloudflare al comprobador. La página existe.
  "https://www\\.eatyourbytes\\.com/",
  # Responde 403 a clientes automáticos. La ficha de la gráfica existe.
  "https://www\\.techpowerup\\.com/",
  # Destino de un formulario (POST), no una página.
  "workers\\.dev",
  # Licencia oficial. El comprobador a veces no conecta (timeout o 403).
  # El texto está en LICENSE y el enlace se queda en la web.
  "https://www\\.gnu\\.org/licenses/gpl-3\\.0\\.html",
]
